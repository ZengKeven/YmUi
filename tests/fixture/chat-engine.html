<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>流式请求测试</title></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createVaporApp, vaporInteropPlugin } from 'vue'
      import { ChatEngine } from 'ym-ui-vapor'
      import 'ym-ui-vapor/style.css'
      import App from './ChatEngineCases.vue'
      window.ChatEngineForTest = ChatEngine
      const app = createVaporApp(App)
      if (new URLSearchParams(location.search).has('renderers')) app.use(vaporInteropPlugin)
      app.mount('#app')
    </script>
  </body>
</html>
